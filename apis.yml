aid: hemab-therapeutics
name: Hemab Therapeutics
description: 'Hemab Therapeutics is a clinical-stage biopharmaceutical company headquartered
  in Copenhagen, Denmark with a US presence in Cambridge, Massachusetts, developing
  prophylactic antibody-based therapeutics for serious, underserved bleeding and thrombotic
  disorders. Its modality-agnostic approach uses monoclonal and bispecific antibodies to
  stabilize coagulation proteins, prevent their premature breakdown, and direct them to
  sites of injury. The clinical pipeline targets Glanzmann Thrombasthenia (sutacimig,
  HMB-001), von Willebrand Disease (HMB-002), Factor VII deficiency and heavy menstrual
  bleeding. Hemab publishes a corporate marketing site, an investor relations site, and
  audience-specific sections for patients, caregivers and healthcare providers. It
  operates no public developer program: there is no developer portal, API reference,
  machine-readable specification, SDK, or webhook surface on any host it controls.'
